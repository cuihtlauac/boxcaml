name: Build OxCaml Switch

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      local_test:
        description: 'Run locally (skip check & commit)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Upstream
        id: check
        run: |
          # Fetch the latest commit hash from the upstream repository
          UPSTREAM_HASH=$(git ls-remote https://github.com/oxcaml/opam-repository.git main | cut -f1)
          echo "Upstream hash: $UPSTREAM_HASH"
          echo "hash=$UPSTREAM_HASH" >> $GITHUB_OUTPUT
          # Check if this hash is already in README.md

          if [ -f README.md ] && grep -q "$UPSTREAM_HASH" README.md; then
            echo "Upstream hash $UPSTREAM_HASH already processed. Exiting."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New hash detected or README missing. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

          # Check for local test override
          if [ "${{ github.event.inputs.local_test }}" == "true" ]; then
             echo "Local test mode: Forcing run."
             echo "skip=false" >> $GITHUB_OUTPUT
             exit 0
          fi

      - name: Initialize Temp Log
        if: steps.check.outputs.skip != 'true'
        run: |
          # Create a temporary file for the current run's log
          touch CURRENT_LOG.md
          # Create a file to track failures
          touch FAILURES

      - name: Update apt
        id: update-apt
        if: steps.check.outputs.skip != 'true'
        run: |
          CMD="sudo apt-get update"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            exit 1
          fi

      - name: Install opam
        id: install-opam
        if: steps.check.outputs.skip != 'true' && steps.update-apt.outcome == 'success'
        run: |
          CMD="sudo apt-get install --no-install-recommends -y rsync opam"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            exit 1
          fi
          echo "" >> CURRENT_LOG.md

      - name: Init opam
        id: init-opam
        if: steps.check.outputs.skip != 'true' && steps.install-opam.outcome == 'success'
        run: |
          CMD="opam init --bare --disable-sandboxing -y"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            exit 1
          fi
          echo "" >> CURRENT_LOG.md

      - name: Create Switch
        id: oxcaml-switch
        if: steps.check.outputs.skip != 'true' && steps.init-opam.outcome == 'success'
        run: |
          CMD="opam switch create 5.2.0+ox --repos ox=git+https://github.com/oxcaml/opam-repository.git,default -y"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            exit 1
          fi
          echo "" >> CURRENT_LOG.md

      - name: Install ocamlformat
        if: steps.check.outputs.skip != 'true' && steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env --switch=5.2.0+ox)
          CMD="opam install -y ocamlformat"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            echo "fail" >> FAILURES
          fi
          echo "" >> CURRENT_LOG.md

      - name: Install merlin
        if: steps.check.outputs.skip != 'true' && steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env --switch=5.2.0+ox)
          CMD="opam install -y merlin"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            echo "fail" >> FAILURES
          fi
          echo "" >> CURRENT_LOG.md

      - name: Install ocaml-lsp-server
        if: steps.check.outputs.skip != 'true' && steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env --switch=5.2.0+ox)
          CMD="opam install -y ocaml-lsp-server"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            echo "fail" >> FAILURES
          fi
          echo "" >> CURRENT_LOG.md

      - name: Install utop
        if: steps.check.outputs.skip != 'true' && steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env --switch=5.2.0+ox)
          CMD="opam install -y utop"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            echo "fail" >> FAILURES
          fi
          echo "" >> CURRENT_LOG.md

      - name: Install parallel
        if: steps.check.outputs.skip != 'true' && steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env --switch=5.2.0+ox)
          CMD="opam install -y parallel"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            echo "fail" >> FAILURES
          fi
          echo "" >> CURRENT_LOG.md

      - name: Install core_unix
        if: steps.check.outputs.skip != 'true' && steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env --switch=5.2.0+ox)
          CMD="opam install -y core_unix"
          echo "Command: \`$CMD\`" >> CURRENT_LOG.md
          if $CMD; then
            echo "Status: SUCCESS" >> CURRENT_LOG.md
          else
            echo "Status: FAILURE" >> CURRENT_LOG.md
            echo "fail" >> FAILURES
          fi
          echo "" >> CURRENT_LOG.md

      - name: Update README
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          # Determine status
          if [ "${{ steps.oxcaml-switch.outcome }}" != "success" ]; then
             STATUS="Failure"
          elif [ -s FAILURES ]; then
             STATUS="Partial Success"
          else
             STATUS="Full Success"
          fi

          DATE=$(date)
          HASH=${{ steps.check.outputs.hash }}

          # Create Header
          echo "$DATE" > HEADER.md
          echo "$HASH" >> HEADER.md
          echo "$STATUS" >> HEADER.md
          echo "" >> HEADER.md

          # Concatenate: Header + Current Log + Existing README (if any)
          cat HEADER.md CURRENT_LOG.md > NEW_README.md
          if [ -f README.md ]; then
            cat README.md >> NEW_README.md
          fi
          mv NEW_README.md README.md

      - name: Publish Report
        if: steps.check.outputs.skip != 'true' && github.event.inputs.local_test != 'true' && always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update build status [skip ci]" && git push)
