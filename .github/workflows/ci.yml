name: Build OxCaml Switch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Report
        run: |
          echo "# Build Status Report" > README.md
          echo "Run Date: $(date)" >> README.md
          echo "" >> README.md

      - name: Install opam
        id: install-opam
        run: |
          CMD="sudo apt-get update && sudo apt-get install --no-install-recommends opam"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if sudo apt-get update && sudo apt-get install --no-install-recommends opam; then
            echo "Status: SUCCESS" >> README.md
            echo "\`\`\`" >> README.md
            echo "" >> README.md
          else
            echo "Status: FAILURE" >> README.md
            echo "\`\`\`" >> README.md
            echo "" >> README.md
            exit 1
          fi

      - name: Init opam
        id: init-opam
        if: steps.install-opam.outcome == 'success'
        run: |
          CMD="opam init --disable-sandboxing -y"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if $CMD; then
            echo "Status: SUCCESS" >> README.md
            echo "\`\`\`" >> README.md
            echo "" >> README.md
          else
            echo "Status: FAILURE" >> README.md
            echo "\`\`\`" >> README.md
            echo "" >> README.md
            exit 1
          fi

      - name: Create Switch
        id: oxcaml-switch
        if: steps.init-opam.outcome == 'success'
        run: |
          CMD="opam switch create 5.2.0+ox --repos ox=git+https://github.com/oxcaml/opam-repository.git,default"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if $CMD; then
            echo "Status: SUCCESS" >> README.md
            echo "\`\`\`" >> README.md
            echo "" >> README.md
          else
            echo "Status: FAILURE" >> README.md
            echo "\`\`\`" >> README.md
            echo "" >> README.md
            exit 1
          fi

      - name: Install ocamlformat
        if: steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env)
          CMD="opam install -y ocamlformat"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if $CMD; then
            echo "Status: SUCCESS" >> README.md
          else
            echo "Status: FAILURE" >> README.md
          fi
          echo "\`\`\`" >> README.md
          echo "" >> README.md

      - name: Install merlin
        if: steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env)
          CMD="opam install -y merlin"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if $CMD; then
            echo "Status: SUCCESS" >> README.md
          else
            echo "Status: FAILURE" >> README.md
          fi
          echo "\`\`\`" >> README.md
          echo "" >> README.md

      - name: Install ocaml-lsp-server
        if: steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env)
          CMD="opam install -y ocaml-lsp-server"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if $CMD; then
            echo "Status: SUCCESS" >> README.md
          else
            echo "Status: FAILURE" >> README.md
          fi
          echo "\`\`\`" >> README.md
          echo "" >> README.md

      - name: Install utop
        if: steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env)
          CMD="opam install -y utop"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if $CMD; then
            echo "Status: SUCCESS" >> README.md
          else
            echo "Status: FAILURE" >> README.md
          fi
          echo "\`\`\`" >> README.md
          echo "" >> README.md

      - name: Install parallel
        if: steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env)
          CMD="opam install -y parallel"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if $CMD; then
            echo "Status: SUCCESS" >> README.md
          else
            echo "Status: FAILURE" >> README.md
          fi
          echo "\`\`\`" >> README.md
          echo "" >> README.md

      - name: Install core_unix
        if: steps.oxcaml-switch.outcome == 'success'
        run: |
          eval $(opam env)
          CMD="opam install -y core_unix"
          echo "## Command: \`$CMD\`" >> README.md
          echo "\`\`\`" >> README.md
          if $CMD; then
            echo "Status: SUCCESS" >> README.md
          else
            echo "Status: FAILURE" >> README.md
          fi
          echo "\`\`\`" >> README.md
          echo "" >> README.md
